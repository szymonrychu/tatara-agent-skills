name: release

# Push-CD: seed a semver tag for the plugin source and propagate the new ref
# into the wrapper's TATARA_SKILLS_REF Dockerfile pin. No image, no chart -
# skills is source the wrapper clones at the pinned git ref.
#
# Gated on a green lint.yml run for the same main commit (workflow_run). The
# cd-release composite action lives once in tatara-helmfile and carries all
# tag + bump + label logic; this repo only declares its outgoing edge.

on:
  workflow_run:
    workflows: [lint]
    types: [completed]

permissions:
  contents: write

jobs:
  release:
    name: Tag semver and propagate skills ref to wrapper
    runs-on: ubuntu-latest
    # Only after lint succeeds, only for push-to-main (not PR validation runs).
    # The last guard breaks the recursion: the plugin.json self-pin PR merge
    # is itself a push to main that reruns lint -> would retrigger this job
    # and re-tag forever. head_commit is populated on workflow_run events
    # triggered by a push (github.event.workflow_run.event == 'push' above),
    # so its message reliably reflects the commit that fired lint.yml here.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      !startsWith(github.event.workflow_run.head_commit.message, 'chore: pin plugin.json')

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          # Full history + tags so cd-release tag can read the latest semver tag.
          fetch-depth: 0
          fetch-tags: true

      # mode=tag: read the merged PR's semver:<level> label for this commit,
      # bump the latest tag, and push skills vX.Y.Z.
      - name: Tag semver (skills vX.Y.Z)
        id: tag
        uses: szymonrychu/tatara-helmfile/.github/actions/cd-release@main
        with:
          mode: tag
          token: ${{ secrets.TATARA_CD_TOKEN }}

      # mode=bump, TERMINAL HOP: rewrite `agent.skillsRef` in every project's
      # values file. THIS is the pin that reaches an agent pod - tatara-operator
      # internal/agent/pod.go appends TATARA_SKILLS_REF from
      # Project.spec.agent.skillsRef unconditionally, so it always overrides the
      # image's baked ENV. Until tatara-helmfile#397 nothing wrote it: the fleet
      # sat on v2.1.1 for eight days and three releases while the wrapper hop
      # below dutifully bumped a value no agent ever read.
      #
      # FIRST, before the wrapper hop. Steps are sequential and fail-fast, and
      # this is the one that reaches production; a wrapper-hop failure must not
      # starve it.
      #
      # parent_repo == tatara-helmfile takes cd-release's terminal-hop path, so
      # this coalesces onto cd/deploy-train with the operator and wrapper bumps
      # and auto-merges on a green helmfile diff. Consequence worth knowing: a
      # red pin-coverage check in that repo now blocks the whole train, not just
      # this commit.
      #
      # Each pattern must keep matching its file exactly once - apply-pins.py
      # treats count==0 as a hard error and fails the whole release, not one pin.
      # tatara-helmfile's check_pin_coverage.py carries this pattern verbatim as
      # SKILLS_PIN_PATTERN and its test suite applies it to the real values
      # files, so a pin-site reformat reds that repo's lint before it can red a
      # release run here.
      - name: Bump tatara-helmfile skillsRef
        if: steps.tag.outputs.version != ''
        uses: szymonrychu/tatara-helmfile/.github/actions/cd-release@main
        with:
          mode: bump
          token: ${{ secrets.TATARA_CD_TOKEN }}
          parent_repo: szymonrychu/tatara-helmfile
          new_value: ${{ steps.tag.outputs.version }}
          pins: |
            [
              {
                "file": "values/project-tatara/common.yaml",
                "pattern": "^(\\s*skillsRef: ).*$",
                "value_template": "\\1{{version}}"
              },
              {
                "file": "values/project-infrastructure/common.yaml",
                "pattern": "^(\\s*skillsRef: ).*$",
                "value_template": "\\1{{version}}"
              },
              {
                "file": "values/project-mtg/common.yaml",
                "pattern": "^(\\s*skillsRef: ).*$",
                "value_template": "\\1{{version}}"
              }
            ]

      # mode=bump: rewrite the wrapper Dockerfile TATARA_SKILLS_REF ARG pin to
      # the freshly cut tag and open an auto-merge PR. Single pin, no chart.
      # This one only seeds the image's runtime ENV default, which the operator
      # overrides for every agent pod (see the hop above); it is the right value
      # for a container run outside the operator, and reaches no pod.
      - name: Bump wrapper TATARA_SKILLS_REF pin
        if: steps.tag.outputs.version != ''
        uses: szymonrychu/tatara-helmfile/.github/actions/cd-release@main
        with:
          mode: bump
          token: ${{ secrets.TATARA_CD_TOKEN }}
          parent_repo: szymonrychu/tatara-claude-code-wrapper
          new_value: ${{ steps.tag.outputs.version }}
          pins: |
            [
              {
                "file": "Dockerfile",
                "pattern": "^ARG TATARA_SKILLS_REF=.*$",
                "value_template": "ARG TATARA_SKILLS_REF={{version}}"
              }
            ]

      # Self-pin: keep .claude-plugin/plugin.json's version in lockstep with
      # the tag we just cut, so it never freezes at its initial value.
      # main requires the "Validate skills and manifests" status check, and a
      # direct [skip ci] push has no check run to satisfy it - so land the
      # bump through an auto-merge PR instead (no [skip ci]: the check MUST
      # run for the PR to become mergeable). The branch is rebuilt from
      # fresh origin/main and force-pushed each run, so a stale branch left
      # over from a prior attempt is simply reset rather than causing a
      # conflict; an already-open PR for it is reused instead of duplicated.
      - name: Pin plugin.json to tag version
        if: steps.tag.outputs.version != ''
        env:
          TOKEN: ${{ secrets.TATARA_CD_TOKEN }}
          GH_TOKEN: ${{ secrets.TATARA_CD_TOKEN }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          bare="${VERSION#v}"
          branch="cd/plugin-pin-${bare}"
          title="chore: pin plugin.json to ${bare}"
          git config user.name "szymonrychu-bot"
          git config user.email "szymonrychu-bot@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git"

          git fetch origin main
          git checkout -B "$branch" origin/main
          jq --arg v "$bare" '.version = $v' .claude-plugin/plugin.json > /tmp/plugin.json
          mv /tmp/plugin.json .claude-plugin/plugin.json
          if git diff --quiet -- .claude-plugin/plugin.json; then
            echo "plugin.json already at ${bare}, nothing to do"
            exit 0
          fi
          git add .claude-plugin/plugin.json
          git commit -m "${title}"
          git push --force origin "${branch}:${branch}"

          pr_number="$(gh pr list --head "${branch}" --state open --json number --jq '.[0].number')"
          if [ -z "${pr_number}" ]; then
            gh pr create \
              --title "${title}" \
              --body "Automated version sync: pins .claude-plugin/plugin.json to the tag just cut by the release workflow (${VERSION})." \
              --head "${branch}" \
              --base main
          fi
          gh pr merge "${branch}" --auto --squash --delete-branch --subject "${title}"

  # Fan the owned CLAUDE.md contract block out to the consumer repos. Its own
  # job, NOT a step of `release`: a doc paragraph must never red a release, so
  # it is continue-on-error and runs only after the tag is already cut
  # (pre-mortem 2 on skills#57). apply-pins.py could not carry this - its
  # value_template language is three version placeholders - and cd-release
  # mode=bump targets exactly one parent_repo, so there is no existing 1->N
  # channel to reuse.
  #
  # Silent when nothing changed: sync_claude_contract.py rewrites only the
  # marker-delimited block, so a release that does not touch the fragment
  # produces no diff and no PR. A repo whose CLAUDE.md carries no markers is
  # skipped, never created - opting in is that repo's own PR.
  sync-contract:
    name: Fan out the shared CLAUDE.md contract block
    runs-on: ubuntu-latest
    needs: release
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Open a sync PR per drifted consumer repo
        env:
          TOKEN: ${{ secrets.TATARA_CD_TOKEN }}
          GH_TOKEN: ${{ secrets.TATARA_CD_TOKEN }}
        run: |
          set -uo pipefail
          consumers="tatara-cli tatara-memory tatara-memory-repo-ingester \
                     tatara-claude-code-wrapper tatara-operator tatara-helmfile \
                     tatara-observability tatara-documentation"
          branch="cd/claude-contract-sync"
          title="chore: sync the shared CLAUDE.md contract block"
          body="Automated sync of the block between the tatara-shared-contract markers from [tatara-agent-skills/template/CLAUDE-shared.md](https://github.com/szymonrychu/tatara-agent-skills/blob/main/template/CLAUDE-shared.md) at ${{ github.event.workflow_run.head_sha }}. Content outside the markers is untouched. Edit the fragment in tatara-agent-skills, not here."
          fragment="$PWD/template/CLAUDE-shared.md"
          script="$PWD/.github/scripts/sync_claude_contract.py"
          failed=""

          for repo in $consumers; do
            echo "::group::${repo}"
            work="$(mktemp -d)"
            if ! git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/szymonrychu/${repo}.git" "$work"; then
              failed="${failed} ${repo}(clone)"
              echo "::endgroup::"
              continue
            fi
            if ! python3 "$script" --write --fragment "$fragment" "$work/CLAUDE.md"; then
              failed="${failed} ${repo}(sync)"
              echo "::endgroup::"
              continue
            fi
            if git -C "$work" diff --quiet -- CLAUDE.md; then
              echo "${repo}: already in sync"
              echo "::endgroup::"
              continue
            fi
            git -C "$work" config user.name "szymonrychu-bot"
            git -C "$work" config user.email "szymonrychu-bot@users.noreply.github.com"
            git -C "$work" checkout -B "$branch"
            git -C "$work" add CLAUDE.md
            git -C "$work" commit -m "$title"
            if ! git -C "$work" push --force origin "${branch}:${branch}"; then
              failed="${failed} ${repo}(push)"
              echo "::endgroup::"
              continue
            fi
            pr="$(gh pr list --repo "szymonrychu/${repo}" --head "$branch" --state open --json number --jq '.[0].number')"
            if [ -z "$pr" ]; then
              gh pr create --repo "szymonrychu/${repo}" --title "$title" --body "$body" --head "$branch" --base main \
                || failed="${failed} ${repo}(pr)"
            fi
            gh pr merge --repo "szymonrychu/${repo}" "$branch" --auto --squash --delete-branch --subject "$title" \
              || echo "${repo}: auto-merge not armed, PR left open for a human"
            echo "::endgroup::"
          done

          if [ -n "$failed" ]; then
            echo "::warning::contract sync incomplete for:${failed} - the next release retries"
          fi
